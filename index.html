<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RIT Point Zero</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Three.js shader canvas (fixed background) -->
  <canvas id="shader-canvas"></canvas>

  <div class="container">
    <header class="hero">
      <h1>RIT Point Zero</h1>
      <p class="subtitle">Latihan Kolaborasi</p>
    </header>

    <div class="search-wrap">
      <input
        type="text"
        class="search-box"
        id="searchInput"
        placeholder="Search by author, filename, or content..."
      >
      <span class="search-count" id="searchCount"></span>
    </div>

    <div class="cards-grid" id="cardsGrid">
      <div class="loading">Loading...</div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle"></span>
        <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script>
    (function initShader() {
      const canvas = document.getElementById('shader-canvas');

      const isMobile =
        window.matchMedia('(max-width: 768px)').matches ||
        /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) ||
        (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4);

      if (isMobile) {
        canvas.style.display = 'none';
        return;
      }

      // WebGL availability check
      try {
        const testCanvas = document.createElement('canvas');
        const gl = testCanvas.getContext('webgl') || testCanvas.getContext('experimental-webgl');
        if (!gl) {
          canvas.style.display = 'none';
          return;
        }
      } catch (e) {
        canvas.style.display = 'none';
        return;
      }

      const renderer = new THREE.WebGLRenderer({
        canvas,
        antialias: true,
        alpha: true
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);

      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

      const uniforms = {
        u_time:      { value: 0 },
        u_resolution:{ value: new THREE.Vector2(window.innerWidth, window.innerHeight) },
      };

      const vertexShader = `
        void main() {
          gl_Position = vec4(position, 1.0);
        }
      `;

      const fragmentShader = `
        precision highp float;

        uniform float u_time;
        uniform vec2  u_resolution;

        float hash(vec2 p) {
          p = fract(p * vec2(123.34, 456.21));
          p += dot(p, p + 45.32);
          return fract(p.x * p.y);
        }

        float noise(vec2 p) {
          vec2 i = floor(p);
          vec2 f = fract(p);
          vec2 u = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(hash(i + vec2(0.0, 0.0)), hash(i + vec2(1.0, 0.0)), u.x),
            mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), u.x),
            u.y
          );
        }

        float fbm(vec2 p) {
          float v = 0.0;
          float a = 0.5;
          for (int i = 0; i < 6; i++) {
            v += a * noise(p);
            p *= 2.0;
            a *= 0.5;
          }
          return v;
        }

        void main() {
          vec2 uv = gl_FragCoord.xy / u_resolution.xy;
          vec2 p = uv;
          p.x *= u_resolution.x / u_resolution.y;

          float t = u_time * 0.08;

          vec2 q = vec2(
            fbm(p * 2.0 + vec2(0.0, t)),
            fbm(p * 2.0 + vec2(t, 0.0))
          );
          vec2 r = vec2(
            fbm(p * 2.0 + 2.5 * q + vec2(1.7, 9.2) + 0.3 * t),
            fbm(p * 2.0 + 2.5 * q + vec2(8.3, 2.8) + 0.3 * t)
          );
          float f = fbm(p * 2.0 + 3.5 * r);

          float veins = sin(f * 10.0 + r.x * 4.0);
          float line = smoothstep(0.88, 1.0, abs(veins));
          float fineVeins = sin(f * 22.0 + r.y * 6.0);
          float fineLine = smoothstep(0.94, 1.0, abs(fineVeins)) * 0.4;

          float wire = clamp(line + fineLine, 0.0, 1.0);

          vec3 base = vec3(0.01, 0.02, 0.03);
          vec3 wireColor = vec3(0.49, 0.83, 0.88);
          vec3 veinTint  = vec3(0.30, 0.45, 0.55);

          float body = smoothstep(0.4, 0.9, f) * 0.08;

          vec3 col = base;
          col += veinTint * body;
          col += wireColor * wire;

          vec2 vp = uv - 0.5;
          vp.x *= u_resolution.x / u_resolution.y;
          float vig = 1.0 - smoothstep(0.5, 1.2, length(vp));
          col *= 0.7 + vig * 0.4;

          gl_FragColor = vec4(col, 1.0);
        }
      `;

      const material = new THREE.ShaderMaterial({
        uniforms,
        vertexShader,
        fragmentShader
      });

      const geometry = new THREE.PlaneGeometry(2, 2);
      const mesh = new THREE.Mesh(geometry, material);
      scene.add(mesh);

      window.addEventListener('resize', () => {
        renderer.setSize(window.innerWidth, window.innerHeight);
        uniforms.u_resolution.value.set(window.innerWidth, window.innerHeight);
      });

      const clock = new THREE.Clock();
      function animate() {
        uniforms.u_time.value = clock.getElapsedTime();
        renderer.render(scene, camera);
        requestAnimationFrame(animate);
      }
      animate();
    })();

    let allData = [];

    function renderMarkdown(text) {
      let html = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');

      html = html.replace(/```([\s\S]*?)```/g, (_, code) =>
        `<pre><code>${code.trim()}</code></pre>`
      );
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      html = html.split('\n\n').map(p => {
        if (p.startsWith('<')) return p;
        return `<p>${p.replace(/\n/g, '<br>')}</p>`;
      }).join('');

      return html;
    }

    function getInitials(name) {
      return name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function renderCards(data) {
      const grid = document.getElementById('cardsGrid');
      const count = document.getElementById('searchCount');

      count.textContent = data.length === allData.length
        ? `${data.length} file${data.length === 1 ? '' : 's'}`
        : `${data.length} / ${allData.length}`;

      if (data.length === 0) {
        grid.innerHTML = '<div class="empty-state">No matching files found</div>';
        return;
      }

      grid.innerHTML = data.map((item, index) => `
        <div class="card" style="animation-delay: ${index * 0.04}s">
          <div class="card-glow"></div>
          <div class="card-header">
            <div class="avatar">${getInitials(item.author)}</div>
            <div class="author-info">
              <div class="author-name">${escapeHtml(item.author)}</div>
              <div class="author-email">${escapeHtml(item.email)}</div>
            </div>
          </div>
          <div class="file-badge">${escapeHtml(item.file)}</div>
          <div class="preview">${escapeHtml(item.preview)}</div>
          <div class="card-footer">
            <span>${item.date}</span>
            <span class="clickable" onclick="openModal(${index})">View →</span>
          </div>
        </div>
      `).join('');

      window._currentData = data;
      attachCardInteractions();
    }

    function attachCardInteractions() {
      document.querySelectorAll('.card').forEach(card => {
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          card.style.setProperty('--mx', `${x}px`);
          card.style.setProperty('--my', `${y}px`);
        });
      });
    }

    function openModal(index) {
      const item = window._currentData[index];
      document.getElementById('modalTitle').textContent = item.file;
      const body = document.getElementById('modalBody');

      if (item.isMarkdown) {
        body.innerHTML = renderMarkdown(item.fullContent);
        body.style.whiteSpace = 'normal';
      } else {
        body.textContent = item.fullContent;
        body.style.whiteSpace = 'pre-wrap';
      }

      document.getElementById('modalOverlay').classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      document.body.style.overflow = '';
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      const query = e.target.value.toLowerCase();
      const filtered = allData.filter(item =>
        item.author.toLowerCase().includes(query) ||
        item.file.toLowerCase().includes(query) ||
        item.preview.toLowerCase().includes(query)
      );
      renderCards(filtered);
    });

    document.getElementById('modalClose').addEventListener('click', closeModal);
    document.getElementById('modalOverlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeModal();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    fetch('data.json')
      .then(res => res.json())
      .then(data => {
        allData = data;
        renderCards(data);
      })
      .catch(err => {
        document.getElementById('cardsGrid').innerHTML =
          '<div class="empty-state">Error loading data. Run <code>node generate-data.js</code> first.</div>';
        console.error(err);
      });
  </script>
</body>
</html>
